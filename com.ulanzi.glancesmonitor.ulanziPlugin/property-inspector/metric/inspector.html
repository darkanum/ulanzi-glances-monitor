<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Server metric</title>
  <link rel="stylesheet" href="../../libs/css/uspi.css">
  <style>
    .status { margin: 4px 0 8px; font-size: 12px; min-height: 16px; }
    .status.ok { color: #3fb950; }
    .status.error { color: #f85149; }
    .hidden-field { display: none; }
  </style>
</head>
<body>
  <div class="uspi-wrapper hidden">
    <form id="property-inspector" autocomplete="off">
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>Glances URL</div>
        <input class="uspi-item-value" name="host" type="text" placeholder="http://192.168.1.10:61208">
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>Username</div>
        <input class="uspi-item-value" name="username" type="text" placeholder="glances">
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>Password</div>
        <input class="uspi-item-value" name="password" type="password">
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label"></div>
        <div class="uspi-item-value status" id="status"></div>
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>Metric</div>
        <select class="uspi-item-value select" name="metric">
          <option value="cpu">CPU</option>
          <option value="mem" data-localize>Memory</option>
          <option value="swap" data-localize>Swap</option>
          <option value="load" data-localize>Load (1 min)</option>
          <option value="disk" data-localize>Disk</option>
          <option value="net" data-localize>Network</option>
          <option value="temp" data-localize>Temperature</option>
          <option value="gpu">GPU</option>
          <option value="gputemp" data-localize>GPU temperature</option>
        </select>
      </div>
      <div class="uspi-item hidden-field" id="target-field">
        <div class="uspi-item-label" data-localize>Target</div>
        <select class="uspi-item-value select" name="target" id="target">
          <option value="" data-localize>Auto</option>
        </select>
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>Label</div>
        <input class="uspi-item-value" name="label" type="text" maxlength="16">
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>Interval</div>
        <select class="uspi-item-value select" name="interval">
          <option value="2">2 s</option>
          <option value="5" selected>5 s</option>
          <option value="10">10 s</option>
          <option value="30">30 s</option>
        </select>
      </div>
      <div class="uspi-item threshold-field">
        <div class="uspi-item-label" data-localize>Warning at</div>
        <input class="uspi-item-value" name="warn" type="number" min="0" max="1000">
      </div>
      <div class="uspi-item threshold-field">
        <div class="uspi-item-label" data-localize>Critical at</div>
        <input class="uspi-item-value" name="danger" type="number" min="0" max="1000">
      </div>
    </form>
  </div>

  <script src="../../libs/js/constants.js"></script>
  <script src="../../libs/js/eventEmitter.js"></script>
  <script src="../../libs/js/timers.js"></script>
  <script src="../../libs/js/utils.js"></script>
  <script src="../../libs/js/ulanziApi.js"></script>
  <script src="../../plugin/metrics.js"></script>
  <script src="../../plugin/glances.js"></script>
  <script src="./inspector.js"></script>
</body>
</html>
